<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sliceRind" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <radialGradient id="slicePith" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde047"/>
    </radialGradient>
    <radialGradient id="segmentGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <radialGradient id="segmentHighlight" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fefce8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="juiceGloss" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <filter id="pulpTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="pulp"/>
      <feColorMatrix in="pulp" type="saturate" values="0"/>
      <feComponentTransfer in="pulp">
        <feFuncA type="table" tableValues="0 0.03 0.06 0.08 0.1 0.12 0.15 0.18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="pulp" mode="overlay"/>
    </filter>
  </defs>
  
  <path d="M50 175 Q50 50 250 50 Q450 50 450 175 Q450 300 250 300 Q50 300 50 175 Z" fill="url(#sliceRind)" filter="url(#pulpTexture)"/>
  
  <path d="M80 175 Q80 80 250 80 Q420 80 420 175 Q420 270 250 270 Q80 270 80 175 Z" fill="url(#slicePith)"/>
  
  <g transform="translate(250, 175)">
    <g filter="url(#pulpTexture)">
      <path d="M0 0 L0 -75 L25 -65 Q35 -45 35 -20 Q35 10 25 25 Q15 35 0 45 Z" fill="url(#segmentGradient)"/>
      <path d="M0 0 L0 75 L-25 65 Q-35 45 -35 20 Q-35 -10 -25 -25 Q-15 -35 0 -45 Z" fill="url(#segmentGradient)" opacity="0.92"/>
      <path d="M0 0 L25 -65 Q60 -55 95 -35 Q120 -10 95 15 Q60 35 25 45 Z" fill="url(#segmentGradient)" opacity="0.95"/>
      <path d="M0 0 L-25 65 Q-60 55 -95 35 Q-120 10 -95 -15 Q-60 -35 -25 -45 Z" fill="url(#segmentGradient)" opacity="0.9"/>
      <path d="M0 0 L25 45 Q55 75 85 95 Q115 110 115 110 L0 75 Z" fill="url(#segmentGradient)" opacity="0.88"/>
      <path d="M0 0 L-25 -45 Q-55 -75 -85 -95 Q-115 -110 -115 -110 L0 -75 Z" fill="url(#segmentGradient)" opacity="0.88"/>
      <path d="M0 0 L95 -35 Q125 -5 130 30 Q120 70 85 95 Z" fill="url(#segmentGradient)" opacity="0.92"/>
      <path d="M0 0 L-95 35 Q-125 5 -130 -30 Q-120 -70 -85 -95 Z" fill="url(#segmentGradient)" opacity="0.9"/>
    </g>
    
    <ellipse cx="0" cy="0" rx="70" ry="70" fill="url(#segmentHighlight)" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="80" ry="80" fill="url(#juiceGloss)" opacity="0.2"/>
    
    <g opacity="0.6" filter="url(#pulpTexture)">
      <ellipse cx="-80" cy="-40" rx="8" ry="6" fill="#fef9c3"/>
      <ellipse cx="60" cy="-50" rx="6" ry="5" fill="#fef9c3"/>
      <ellipse cx="-50" cy="55" rx="7" ry="5" fill="#fde047"/>
      <ellipse cx="90" cy="30" rx="5" ry="4" fill="#fef9c3"/>
      <ellipse cx="-95" cy="20" rx="5" ry="4" fill="#fde047"/>
      <ellipse cx="40" cy="-85" rx="5" ry="4" fill="#fef9c3"/>
      <ellipse cx="-70" cy="-80" rx="4" ry="3" fill="#facc15"/>
      <ellipse cx="85" cy="-20" rx="4" ry="3" fill="#fde047"/>
    </g>
  </g>
  
  <path d="M50 175 Q50 50 250 50 Q450 50 450 175" stroke="#ca8a04" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M250 300 Q250 300 250 300" stroke="#ca8a04" stroke-width="1" fill="none" opacity="0.3"/>
</svg>